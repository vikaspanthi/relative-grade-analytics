<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relative Grade Analytics</title><link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head><body>
<header><h1>Relative Grade Analytics</h1><div class="sub">Student Assessment &amp; Result Analysis System</div></header>
<section class="bar">
<input type="file" id="file" accept=".xlsx,.xls,.csv" multiple>
<label>Mode <select id="mode"><option value="CAT1">CAT-I Only</option><option value="CAT2">CAT-II Only</option><option value="COMB">Combined CAT-I + CAT-II</option></select></label>
<label>CAT-I wt % <input type="number" id="w1" value="50" min="0" max="100"></label>
<label>CAT-II wt % <input type="number" id="w2" value="50" min="0" max="100"></label>
<label>Course <select id="fc"></select></label>
<label>Faculty <select id="ff"></select></label>
<button id="csv">Export filtered CSV</button><button id="shtml">Download Summary HTML</button><button id="pdf">Download PDF Report</button>
</section>
<div id="msg"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Student data is processed locally in your browser. &nbsp;|&nbsp; Developed by Dr. Vikas Panthi, PC CSE Core, SCOPE</footer>
<script src="app.js"></script>
</body></html>
